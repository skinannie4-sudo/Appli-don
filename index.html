<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boîte de Réception - DonObjet Canada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f7f7f7; color: #222; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #222; color: white; padding: 1.2rem; text-align: center; font-size: 1.4rem; font-weight: bold; }
        .container { max-width: 800px; margin: 0 auto; padding: 1rem; flex: 1; }
        .liste-conv { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .conv-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-bottom: 1px solid #eee; cursor: pointer; }
        .conv-item:hover { background: #f8f9fa; }
        .conv-mini-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }
        .conv-info { flex: 1; }
        .conv-titre { font-weight: bold; font-size: 1.1rem; margin-bottom: 0.2rem; }
        .conv-apres { color: #666; font-size: 0.9rem; }

        .zone-discussion { display: none; max-width: 700px; margin: 0 auto; background: white; flex: 1; flex-direction: column; min-height: 100vh; }
        .entete { background: #e30a17; color: white; padding: 1rem; display: flex; align-items: center; gap: 1rem; }
        .retour { cursor: pointer; font-size: 1.3rem; }

        .profil-objet-admin { text-align: center; padding: 2rem 1rem; border-bottom: 2px solid #f0f0f0; background: #fff8f8; }
        .avatar-objet-admin { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 4px solid #e30a17; }
        .titre-objet-admin { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.3rem; color: #b30000; }
        .lieu-objet-admin { color: #666; margin-bottom: 0.5rem; font-style: italic; }
        .categorie-objet-admin { display: inline-block; background: #e30a17; color: white; padding: 0.3rem 1rem; border-radius: 15px; font-weight: bold; font-size: 0.9rem; margin-bottom: 1rem; }

        .messages { flex: 1; padding: 1rem; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 0.8rem; }
        .msg { max-width: 75%; padding: 0.8rem 1rem; border-radius: 18px; font-size: 0.95rem; }
        .msg.visiteur { background: #ddd; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.reponse { background: #00b958; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-img { max-width: 70%; border-radius: 12px; overflow: hidden; }
        .msg-img.visiteur { align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-img.reponse { align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-img img { width: 100%; height: auto; display: block; }

        .barre-reponse { display: flex; border-top: 1px solid #eee; padding: 0.8rem; gap: 0.5rem; align-items: center; }
        .btn-plus-rep { font-size: 1.6rem; font-weight: bold; color: #555; cursor: pointer; padding: 0 0.5rem; user-select: none; }
        .barre-reponse input[type="text"] { flex: 1; padding: 0.8rem 1rem; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 1rem; }
        .btn-repondre { background: #00b958; color: white; border: none; padding: 0 1.5rem; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #input-photo-rep { display: none; }
        .apercu-rep { display: flex; gap: 8px; padding: 0.5rem 1rem; background: #fafafa; border-top: 1px solid #eee; }
        .apercu-rep img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 2px solid #ddd; }

        /* ✅ PIED DE PAGE + LANGUES */
        footer {
            background-color: #e30a17;
            color: white;
            text-align: center;
            padding: 1.5rem 5%;
            margin-top: auto;
        }
        .footer-logo {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
        }
        .feuille {
            font-size: 1.6rem;
            margin-right: 0.5rem;
        }
        .langues {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .lang-btn:hover, .lang-btn.active {
            background: white;
            color: #e30a17;
        }
        .copyright {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<header>📬 Ma Boîte de Réception - DonObjet Canada</header>
<div class="container">
    <div class="liste-conv" id="liste-conversations"></div>
</div>

<div class="zone-discussion" id="page-discussion">
    <div class="entete">
        <span class="retour" onclick="afficherListe()">←</span>
        <span id="titre-conv"></span>
    </div>

    <div class="profil-objet-admin">
        <img class="avatar-objet-admin" id="avatar-admin" src="" alt="Objet">
        <div class="titre-objet-admin" id="titre-admin"></div>
        <div class="lieu-objet-admin" id="lieu-admin"></div>
        <span class="categorie-objet-admin" id="cat-admin"></span>
    </div>

    <div class="messages" id="messages-conv"></div>
    <div class="apercu-rep" id="apercu-rep" style="display:none;"></div>
    <div class="barre-reponse">
        <input type="file" id="input-photo-rep" accept="image/*">
        <span class="btn-plus-rep" id="btn-plus-rep">+</span>
        <input type="text" placeholder="Votre réponse..." id="champ-reponse">
        <button class="btn-repondre" id="btn-repondre">Répondre</button>
    </div>
</div>

<!-- ✅ PIED DE PAGE AVEC LANGUES -->
<footer>
    <div class="footer-logo"><span class="feuille">🍁</span> DonObjet Canada</div>
    
    <div class="langues">
        <button class="lang-btn active" onclick="changerLangueBoite('fr')">Français</button>
        <button class="lang-btn" onclick="changerLangueBoite('en')">English</button>
        <button class="lang-btn" onclick="changerLangueBoite('it')">Italiano</button>
    </div>

    <div class="copyright">© 2026 - Tous droits réservés</div>
</footer>

<script>
const donneesVehicules = {
    "Voiture - Montréal": {
        titre: "Berline standard",
        lieu: "📍 Montréal, QC",
        categorie: "🚗 Voiture",
        img: "https://i.ibb.co/8LyvjyRZ/W103477113-STANDARD-0.webp"
    },
    "Tracteur - Québec rural": {
        titre: "Tracteur agricole",
        lieu: "📍 Québec rural",
        categorie: "🚜 Tracteur",
        img: "https://i.ibb.co/dwbHCqPZ/FB-IMG-1787787294065.jpg"
    },
    "Camping-car - Québec": {
        titre: "Camping-car Confort",
        lieu: "📍 Québec",
        categorie: "🏕️ Camping-car",
        img: "https://i.ibb.co/qLQXGmrN/FB-IMG-1787786602726.jpg"
    },
    "Camping-car - Ontario": {
        titre: "Camping-car Familial",
        lieu: "📍 Ontario",
        categorie: "🏕️ Camping-car",
        img: "https://i.ibb.co/20y8nP6x/FB-IMG-1787786988933.jpg"
    }
};

// ✅ TRADUCTIONS BOÎTE
const tradBoite = {
    fr: {
        titreListe: "📬 Ma Boîte de Réception - DonObjet Canada",
        aucunMsg: "Aucun message pour l'instant.",
        dernier: "Dernier",
        repondre: "Répondre",
        placeholder: "Votre réponse..."
    },
    en: {
        titreListe: "📬 My Inbox - DonObjet Canada",
        aucunMsg: "No messages yet.",
        dernier: "Last",
        repondre: "Reply",
        placeholder: "Your reply..."
    },
    it: {
        titreListe: "📬 La mia casella - DonObjet Canada",
        aucunMsg: "Nessun messaggio per ora.",
        dernier: "Ultimo",
        repondre: "Rispondi",
        placeholder: "La tua risposta..."
    }
};

let convEnCours = "";
let photosRep = [];
let langueBoite = "fr";

function changerLangueBoite(lang) {
    langueBoite = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    const t = tradBoite[lang];
    document.querySelector('header').textContent = t.titreListe;
    document.getElementById('btn-repondre').textContent = t.repondre;
    document.getElementById('champ-reponse').placeholder = t.placeholder;
    chargerListe();
}

function chargerListe() {
    const liste = document.getElementById('liste-conversations');
    const stock = JSON.parse(localStorage.getItem('messages_donobjet') || '{}');
    const t = tradBoite[langueBoite];
    liste.innerHTML = '';
    if (Object.keys(stock).length === 0) {
        liste.innerHTML = `<div class="conv-item"><span>${t.aucunMsg}</span></div>`;
        return;
    }
    for (let titre in stock) {
        const dernier = stock[titre][stock[titre].length - 1];
        const vehicule = donneesVehicules[titre] || { img: "", titre: titre };
        const div = document.createElement('div');
        div.className = 'conv-item';
        let resume = dernier.image ? '[Photo]' : dernier.texte.substring(0, 45) + '...';
        div.innerHTML = `
            <img class="conv-mini-img" src="${vehicule.img}" alt="">
            <div class="conv-info">
                <div class="conv-titre">${titre}</div>
                <div class="conv-apres">${t.dernier} : ${resume}</div>
            </div>
        `;
        div.onclick = () => ouvrirConv(titre);
        liste.appendChild(div);
    }
}

function afficherListe() {
    document.querySelector('.container').style.display = 'block';
    document.getElementById('page-discussion').style.display = 'none';
    chargerListe();
}

function ouvrirConv(titre) {
    convEnCours = titre;
    photosRep = [];
    document.getElementById('apercu-rep').innerHTML = '';
    document.getElementById('apercu-rep').style.display = 'none';
    
    const vehicule = donneesVehicules[titre] || { titre: titre, lieu: "", categorie: "", img: "" };
    document.getElementById('titre-conv').textContent = titre;
    document.getElementById('avatar-admin').src = vehicule.img;
    document.getElementById('titre-admin').textContent = vehicule.titre;
    document.getElementById('lieu-admin').textContent = vehicule.lieu;
    document.getElementById('cat-admin').textContent = vehicule.categorie;

    document.querySelector('.container').style.display = 'none';
    document.getElementById('page-discussion').style.display = 'flex';
    afficherMessages();
}

function afficherMessages() {
    const zone = document.getElementById('messages-conv');
    const stock = JSON.parse(localStorage.getItem('messages_donobjet') || '{}');
    const liste = stock[convEnCours] || [];
    zone.innerHTML = '';
    liste.forEach(m => {
        if (m.image) {
            const div = document.createElement('div');
            div.className = 'msg-img ' + (m.expediteur === 'visiteur' ? 'visiteur' : 'reponse');
            div.innerHTML = `<img src="${m.image}" alt="photo">`;
            zone.appendChild(div);
        } else if (m.texte) {
            const div = document.createElement('div');
            div.className = 'msg ' + (m.expediteur === 'visiteur' ? 'visiteur' : 'reponse');
            div.textContent = m.texte;
            zone.appendChild(div);
        }
    });
    zone.scrollTop = zone.scrollHeight;
}

document.getElementById('btn-plus-rep').addEventListener('click', () => {
    document.getElementById('input-photo-rep').click();
});

document.getElementById('input-photo-rep').addEventListener('change', e => {
    const fichiers = Array.from(e.target.files);
    if (!fichiers.length) return;
    const apercu = document.getElementById('apercu-rep');
    fichiers.forEach(f => {
        const reader = new FileReader();
        reader.onload = evt => {
            photosRep.push(evt.target.result);
            const img = document.createElement('img');
            img.src = evt.target.result;
            apercu.appendChild(img);
        };
        reader.readAsDataURL(f);
    });
    apercu.style.display = 'flex';
    e.target.value = '';
});

function repondre() {
    const champ = document.getElementById('champ-reponse');
    const texte = champ.value.trim();
    if ((!texte && !photosRep.length) || !convEnCours) return;

    const stock = JSON.parse(localStorage.getItem('messages_donobjet') || '{}');
    if (!stock[convEnCours]) stock[convEnCours] = [];

    if (texte) {
        stock[convEnCours].push({ expediteur: 'proprietaire', texte: texte, image: null });
    }
    photosRep.forEach(src => {
        stock[convEnCours].push({ expediteur: 'proprietaire', texte: null, image: src });
    });

    localStorage.setItem('messages_donobjet', JSON.stringify(stock));
    champ.value = '';
    photosRep = [];
    document.getElementById('apercu-rep').innerHTML = '';
    document.getElementById('apercu-rep').style.display = 'none';
    afficherMessages();
}

document.getElementById('btn-repondre').addEventListener('click', repondre);
document.getElementById('champ-reponse').addEventListener('keydown', e => { if (e.key === 'Enter') repondre(); });

chargerListe();
setInterval(chargerListe, 8000);
</script>
</body>
</html>
